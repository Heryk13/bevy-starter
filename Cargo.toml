[package]
name = "bevy-starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# jpeg for photographic backgrounds, wav for short UI sounds.
# bevy's defaults only cover png and ogg vorbis.
bevy = { version = "0.19.1", features = ["jpeg", "wav"] }
# the translations: fluent turns a key and its arguments into a sentence in the
# player's language, unic-langid names the language for its plural rules
fluent-bundle = "0.16"
rand = "0.10.3"
# the settings and save files: serde turns a struct into text and back, ron is the
# text format. both are already in the tree through bevy
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# the OS language, followed on the first run. already in the tree through bevy
sys-locale = "0.3"
unic-langid = "0.9.6"

[features]
default = ["dev"]
# dev-only helpers, release builds turn them off with --no-default-features
dev = ["bevy/dynamic_linking", "bevy/dev"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
# systems receive their params via dependency injection, so many arguments is normal
too_many_arguments = "allow"
# queries naturally have complex types
type_complexity = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"

# light optimization for our code, so dev builds run smoothly and still compile fast
[profile.dev]
opt-level = 1

# full optimization for dependencies, they rarely change so this cost is paid once
[profile.dev.package."*"]
opt-level = 3

# slower to build, but a faster and smaller binary
[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
# reads a translation file's keys, so a test can compare the languages
fluent-syntax = "0.12"
