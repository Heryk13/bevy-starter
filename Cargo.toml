[package]
name = "bevy-starter"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# jpeg for photographic backgrounds, wav for short UI sounds.
# bevy's defaults only cover png and ogg vorbis.
# only the 2d, ui, audio, jpeg and wav features: the defaults would also build 3d
bevy = { version = "0.20.0", default-features = false, features = ["2d", "ui", "audio", "jpeg", "wav"] }
# the translations: fluent turns a key and its arguments into a sentence in the
# player's language, unic-langid names the language for its plural rules
fluent-bundle = "0.16"
# not used directly: its `logging` feature sends parley's known warning about Japanese
# text through `log`, where main.rs filters it; without it, debug builds `eprintln!` it
icu_provider = { version = "2.3.1", features = ["logging"] }
rand = "0.10.3"
# the settings and save files: serde turns a struct into text and back, ron is the
# text format. both are already in the tree through bevy
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
# the OS language, followed on the first run. already in the tree through bevy
sys-locale = "0.3.2"
unic-langid = "0.9.6"

[features]
default = ["dev"]
# dev-only helpers, release builds turn them off with --no-default-features
dev = ["bevy/dynamic_linking", "bevy/dev"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
# systems receive their params via dependency injection, so many arguments is normal
too_many_arguments = "allow"
# queries naturally have complex types
type_complexity = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
# CONTRIBUTING forbids mod.rs (a split module is `player.rs` next to `player/`), and this
# lint makes the rule hold without review
mod_module_files = "warn"

# light optimization for our code, so dev builds run smoothly and still compile fast
[profile.dev]
opt-level = 1

# full optimization for dependencies, they rarely change so this cost is paid once
[profile.dev.package."*"]
opt-level = 3

# slower to build, but a faster and smaller binary
[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
# reads a translation file's keys, so a test can compare the languages
fluent-syntax = "0.12"
