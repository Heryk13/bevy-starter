[package]
name = "bevy-starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.19.1"

[features]
default = ["dev"]
# dev-only helpers, release builds turn them off with --no-default-features
dev = ["bevy/dynamic_linking", "bevy/dev"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
# systems receive their params via dependency injection, so many arguments is normal
too_many_arguments = "allow"
# queries naturally have complex types
type_complexity = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"

# light optimization for our code, so dev builds run smoothly and still compile fast
[profile.dev]
opt-level = 1

# full optimization for dependencies, they rarely change so this cost is paid once
[profile.dev.package."*"]
opt-level = 3

# slower to build, but a faster and smaller binary
[profile.release]
codegen-units = 1
lto = "thin"
